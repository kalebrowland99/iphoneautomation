# Popup detection definitions
# Used by PopupManager and the vision layer

popups:
  permission_dialog:
    description: "iOS permission request dialog"
    pause_workflow: true
    ocr_keywords:
      - "Would Like to"
      - "Allow"
      - "Don't Allow"
      - "access your"
    templates:
      - name: permission_allow
        path: "permission_allow.png"
        threshold: 0.85
    dismiss_action:
      type: tap_detection
      detection: permission_allow

  update_prompt:
    description: "iOS or app update prompt"
    pause_workflow: true
    ocr_keywords:
      - "Software Update"
      - "Update Now"
      - "Remind Me Later"
      - "Not Now"
    templates:
      - name: update_not_now
        path: "update_not_now.png"
        threshold: 0.85
    dismiss_action:
      type: tap_detection
      detection: update_not_now

  login_prompt:
    description: "Login or sign-in screen"
    pause_workflow: true
    ocr_keywords:
      - "Sign In"
      - "Log In"
      - "Enter your password"
      - "Apple ID"
    dismiss_action:
      type: home

  confirmation_dialog:
    description: "Generic confirmation dialog"
    pause_workflow: false
    ocr_keywords:
      - "Are you sure"
      - "Confirm"
      - "Cancel"
      - "OK"
    templates:
      - name: ok_button
        path: "ok_button.png"
        threshold: 0.85
    dismiss_action:
      type: tap_detection
      detection: ok_button

  tiktok_email_confirm:
    description: "TikTok confirm use of email — always tap Not Now"
    pause_workflow: false
    ocr_keywords:
      - "confirm use of email"
      - "Confirm use of email"
      - "confirm your email"
      - "use your email"
      - "link your email"
      - "verify your email"
    dismiss_action:
      type: tap_ocr
      texts: ["Not Now", "NOT NOW", "Not now"]
      threshold: 0.65
      contain: true
      optional: false

  tiktok_post_notify:
    description: "TikTok post interactions notification — tap dismiss (196, 193)"
    pause_workflow: false
    ocr_keywords:
      - "Get notified of post interactions"
      - "notified of post interactions"
      - "post interactions?"
      - "Get notified"
    dismiss_action:
      type: tap
      x: 196
      y: 193

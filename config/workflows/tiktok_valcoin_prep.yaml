name: tiktok_valcoin_prep
description: >
  After Labely posts: VPN off → clear/upload ValCoin gallery → VPN on → open TikTok.

loop: false

steps:
  # ── 1. Clear Labely videos + upload ValCoin gallery (VPN off once before clear) ─
  # Always runs — including when Use my videos is on (not gated by unless_use_supplied_videos).
  - type: execute_action
    name: clear_album
    on_failure: pause
    action:
      type: album_clear
      timeout_ms: 60000
      sheet_appear_timeout_seconds: 18
      round_active_timeout_seconds: 60
      sheet_poll_interval_seconds: 5
    skip_post_action: true

  - type: wait
    name: after_clear
    duration_seconds: 3

  - type: execute_action
    name: upload_gallery
    on_failure: pause
    action:
      type: album_upload
      folder: ${gallery_folder}
      timeout_ms: 300000
    skip_post_action: true

  - type: wait
    name: upload_progress
    duration_seconds: 10

  - type: execute_action
    name: tap_allow_upload
    action:
      type: tap_ocr
      texts: ["Always Allow", "Allow Full Access", "Allow Access to All Photos", "Allow Paste", "Allow"]
      optional: true
      wait_timeout_seconds: 10
      poll_interval_seconds: 1.5
    skip_post_action: true

  - type: wait
    name: upload_settle
    duration_seconds: 5

  # ── 3. Turn VPN on before TikTok ────────────────────────────────────
  - type: execute_action
    name: vpn_on
    on_failure: pause
    action:
      type: vpn_on
    skip_post_action: true

  - type: execute_action
    name: open_tiktok
    on_failure: pause
    action:
      type: tap
      x: 507
      y: 1011
    skip_post_action: true

  - type: wait
    name: after_open_tiktok
    duration_seconds: 2

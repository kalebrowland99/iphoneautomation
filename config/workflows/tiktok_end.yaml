name: tiktok_end
description: >
  After posting: force-quit apps (AppSwitch + swipe up ×5), then turn off VPN
  via Shadowrocket URL shortcut.

loop: false

steps:
  # ── 1. Force-quit apps ──────────────────────────────────────────────
  # Press home first — after posting TikTok may still have keyboard/upload UI up;
  # AppSwitch won't open the card switcher reliably, and swipes scroll the feed.
  - type: execute_action
    name: go_home_before_kill
    action:
      type: home
    skip_post_action: true

  - type: wait
    name: settle_before_kill
    duration_seconds: 3

  - type: execute_action
    name: kill_apps
    on_failure: pause
    action:
      type: kill_app
    skip_post_action: true

  - type: wait
    name: after_kill
    duration_seconds: 3

  - type: execute_action
    name: go_home
    action:
      type: home
    skip_post_action: true

  - type: wait
    name: settle_home
    duration_seconds: 3

  # ── 2. Turn VPN off via URL shortcut ────────────────────────────────
  - type: execute_action
    name: vpn_off_shortcut
    on_failure: pause
    action:
      type: vpn_off
    skip_post_action: true

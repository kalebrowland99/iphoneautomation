name: tiktok_end
description: >
  After posting: force-quit apps (AppSwitch + swipe up ×5), then turn off VPN
  (open Shadowrocket → tap VPN toggle, same as prep).

loop: false

steps:
  # ── 1. Force-quit apps ──────────────────────────────────────────────
  # Press home first — after posting TikTok may still have keyboard/upload UI up;
  # AppSwitch won't open the card switcher reliably, and swipes scroll the feed.
  - type: execute_action
    name: go_home_before_kill
    action:
      type: home
    skip_post_action: true

  - type: wait
    name: settle_before_kill
    duration_seconds: 3

  - type: execute_action
    name: kill_apps
    on_failure: pause
    action:
      type: kill_app
    skip_post_action: true

  - type: wait
    name: after_kill
    duration_seconds: 3

  - type: execute_action
    name: go_home
    action:
      type: home
    skip_post_action: true

  - type: wait
    name: settle_home
    duration_seconds: 3

  # ── 2. Open Shadowrocket → tap VPN toggle (same as prep) ────────────
  - type: screenshot
    name: home_for_shadowrocket
    templates: [shadowrocket]

  - type: analyze_screen
    name: analyze_shadowrocket
    templates: [shadowrocket]

  - type: execute_action
    name: open_shadowrocket
    on_failure: pause
    action:
      type: tap_detection
      detection: shadowrocket
    skip_post_action: true

  - type: wait
    name: shadowrocket_open
    duration_seconds: 2

  - type: screenshot
    name: shadowrocket_toggle_screen
    templates: [vpntoggle, bluetoggle]

  - type: analyze_screen
    name: analyze_vpntoggle
    templates: [vpntoggle, bluetoggle]

  - type: execute_action
    name: tap_vpntoggle
    on_failure: pause
    action:
      type: tap_detection
      detection: vpntoggle
      refind_on_device: true
    skip_post_action: true

  - type: wait
    name: after_vpn_toggle
    duration_seconds: 3

  - type: execute_action
    name: go_home_final
    action:
      type: home
    skip_post_action: true

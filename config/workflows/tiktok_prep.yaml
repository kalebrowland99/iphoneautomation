name: tiktok_prep
description: >
  Sequential prep (Labely account 1): unlock → force-quit apps → VPN off once → clear/upload gallery.
  Then turn VPN on via Shadowrocket URL shortcut, open TikTok.

loop: false

steps:
  # ── 1. Unlock if locked ─────────────────────────────────────────────
  - type: screenshot
    name: initial_screen
    templates: [lock_screen]

  - type: analyze_screen
    name: analyze_initial
    templates: [lock_screen]

  - type: execute_action
    name: unlock_device
    when_detection: lock_screen
    on_failure: pause
    action:
      type: tap_detection
      detection: lock_screen
    skip_post_action: true

  - type: execute_action
    name: swipe_unlock
    when_detection: lock_screen
    on_failure: pause
    action:
      type: swipe
      x1: 200
      y1: 500
      x2: 200
      y2: 200
      duration_ms: 300
    skip_post_action: true

  - type: wait
    name: after_unlock
    when_detection: lock_screen
    duration_seconds: 0.5

  # ── 2. Force-quit apps ──────────────────────────────────────────────
  - type: execute_action
    name: go_home_before_kill
    action:
      type: home
    skip_post_action: true

  - type: wait
    name: settle_before_kill
    duration_seconds: 0.5

  - type: execute_action
    name: kill_apps
    on_failure: pause
    action:
      type: kill_app
    skip_post_action: true

  - type: execute_action
    name: go_home
    action:
      type: home
    skip_post_action: true

  - type: wait
    name: settle_home
    duration_seconds: 0.5

  # ── 3. Clear photo library (VPN disconnect once, then iMouse album API) ─
  - type: execute_action
    name: clear_album
    on_failure: pause
    action:
      type: album_clear
      timeout_ms: 60000
      sheet_appear_timeout_seconds: 18
      round_active_timeout_seconds: 60
      sheet_poll_interval_seconds: 5
    skip_post_action: true

  - type: wait
    name: after_clear
    duration_seconds: 3

  # ── 4. Upload gallery folder (slot number, e.g. gallery/12/) ──────
  - type: execute_action
    name: upload_gallery
    on_failure: pause
    action:
      type: album_upload
      folder: ${gallery_folder}
    skip_post_action: true

  - type: wait
    name: upload_progress
    duration_seconds: 10

  - type: execute_action
    name: tap_allow_upload
    action:
      type: tap_ocr
      texts: ["Always Allow", "Allow Full Access", "Allow Access to All Photos", "Allow Paste", "Allow"]
      optional: true
      wait_timeout_seconds: 10
      poll_interval_seconds: 1.5
    skip_post_action: true

  - type: wait
    name: upload_settle
    duration_seconds: 5

  # ── 5. VPN on → TikTok ──────────────────────────────────────────────
  - type: execute_action
    name: vpn_on_shortcut
    on_failure: pause
    action:
      type: vpn_on
    skip_post_action: true

  - type: execute_action
    name: open_tiktok
    on_failure: pause
    action:
      type: tap
      x: 507
      y: 1011
    skip_post_action: true

  - type: wait
    name: after_open_tiktok
    duration_seconds: 2

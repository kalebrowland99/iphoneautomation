name: tiktok_prep
description: >
  Sequential prep: unlock → home → clear gallery via iMouse album API → upload
  gallery → VPN (Shadowrocket — "Not Connected" OCR + vpntoggle) → TikTok. VPN runs
  AFTER the album clear/upload so it can't interfere with the Photos shortcut.
  Phone slot folder (e.g. gallery/12/).

loop: false

steps:
  # ── 0. Reset iMouse cursor (twice) ─────────────────────────────────
  - type: execute_action
    name: mouse_reset_1
    action:
      type: mouse_reset
    skip_post_action: true

  - type: wait
    name: after_mouse_reset_1
    duration_seconds: 0.25

  - type: execute_action
    name: mouse_reset_2
    action:
      type: mouse_reset
    skip_post_action: true

  - type: wait
    name: after_mouse_reset_2
    duration_seconds: 0.25

  # ── 1. Unlock if locked ─────────────────────────────────────────────
  - type: screenshot
    name: initial_screen
    templates: [lock_screen]

  - type: analyze_screen
    name: analyze_initial
    templates: [lock_screen]

  - type: execute_action
    name: unlock_device
    when_detection: lock_screen
    on_failure: pause
    action:
      type: tap_detection
      detection: lock_screen
    skip_post_action: true

  - type: execute_action
    name: swipe_unlock
    when_detection: lock_screen
    on_failure: pause
    action:
      type: swipe
      x1: 200
      y1: 500
      x2: 200
      y2: 200
      duration_ms: 300
    skip_post_action: true

  - type: wait
    name: after_unlock
    when_detection: lock_screen
    duration_seconds: 2

  # ── 2. Go home ──────────────────────────────────────────────────────
  - type: execute_action
    name: go_home
    action:
      type: home
    skip_post_action: true

  - type: wait
    name: settle_home
    duration_seconds: 0.5

  # ── 3. Clear photo library (iMouse album API — Photos app not required) ─
  # go_home above — no second home press before clear.
  - type: execute_action
    name: clear_album
    on_failure: pause
    action:
      type: album_clear
      timeout_ms: 120000
    skip_post_action: true

  # album_clear returns as soon as the Delete press settles, so the upload
  # below fires right off that delete trigger (just a brief settle here).
  - type: wait
    name: after_clear
    duration_seconds: 1

  # ── 4. Upload gallery folder (slot number, e.g. gallery/12/) ──────
  - type: execute_action
    name: upload_gallery
    on_failure: pause
    action:
      type: album_upload
      folder: ${gallery_folder}
    skip_post_action: true

  - type: wait
    name: upload_progress
    duration_seconds: 10

  - type: execute_action
    name: tap_allow_upload
    action:
      type: tap_ocr
      texts: ["Always Allow", "Allow Full Access", "Allow Access to All Photos", "Allow Paste", "Allow"]
      optional: true
      wait_timeout_seconds: 10
      poll_interval_seconds: 1.5
    skip_post_action: true

  - type: wait
    name: upload_settle
    duration_seconds: 5

  # ── 5. Go home before VPN check ─────────────────────────────────────
  - type: execute_action
    name: go_home_before_vpn
    action:
      type: home
    skip_post_action: true

  - type: wait
    name: settle_home_vpn
    duration_seconds: 0.5

  # ── 6. Open Shadowrocket → VPN status via "Not Connected" text ─────
  - type: screenshot
    name: home_for_shadowrocket
    templates: [shadowrocket]

  - type: analyze_screen
    name: analyze_shadowrocket
    templates: [shadowrocket]

  - type: execute_action
    name: open_shadowrocket
    on_failure: pause
    action:
      type: tap_detection
      detection: shadowrocket
    skip_post_action: true

  - type: wait
    name: shadowrocket_open
    duration_seconds: 2

  - type: check_ocr_state
    name: vpn_state
    action:
      texts: ["Not Connected", "NOT CONNECTED", "Not connected"]
      threshold: 0.65
      duration_seconds: 12
      retry_delay: 1.5
      state_if_found: WAITING
      state_if_missing: ACTIVE
      fallback_template: vpntoggle
      state_if_fallback: WAITING

  # ── 7. VPN off → tap vpntoggle → verify "Not Connected" gone ───────
  - type: screenshot
    name: shadowrocket_toggle_screen
    when_state: WAITING
    templates: [vpntoggle]

  - type: analyze_screen
    name: analyze_vpntoggle
    when_state: WAITING
    templates: [vpntoggle]

  - type: execute_action
    name: tap_vpntoggle
    when_state: WAITING
    when_detection: vpntoggle
    on_failure: pause
    action:
      type: tap_detection
      detection: vpntoggle
      refind_on_device: true
    skip_post_action: true

  - type: wait
    name: after_vpn_toggle
    when_state: WAITING
    duration_seconds: 2

  - type: screenshot
    name: verify_vpn_connected_screen
    when_state: WAITING

  - type: analyze_screen
    name: analyze_vpn_connected
    when_state: WAITING
    ocr_keywords: ["Not Connected"]

  - type: verify
    name: confirm_vpn_connected
    when_state: WAITING
    condition: ocr_missing
    template: "Not Connected"
    on_failure: pause

  - type: determine_state
    name: vpn_active_confirmed
    when_state: WAITING
    state_rules:
      - condition: ocr_missing
        text: "Not Connected"
        state: ACTIVE
      - condition: default
        state: WAITING

  # ── 8. Home after VPN ───────────────────────────────────────────────
  - type: execute_action
    name: go_home_after_vpn
    action:
      type: home
    skip_post_action: true

  - type: wait
    name: after_vpn_home
    duration_seconds: 2

  # ── 9. Re-check VPN in Shadowrocket before TikTok (if still WAITING) ─
  - type: execute_action
    name: go_home_before_vpn_recheck
    when_state: WAITING
    action:
      type: home
    skip_post_action: true

  - type: wait
    name: before_vpn_recheck
    when_state: WAITING
    duration_seconds: 1

  - type: screenshot
    name: home_for_shadowrocket_recheck
    when_state: WAITING
    templates: [shadowrocket]

  - type: analyze_screen
    name: analyze_shadowrocket_recheck
    when_state: WAITING
    templates: [shadowrocket]

  - type: execute_action
    name: open_shadowrocket_recheck
    when_state: WAITING
    on_failure: pause
    action:
      type: tap_detection
      detection: shadowrocket
    skip_post_action: true

  - type: wait
    name: shadowrocket_open_recheck
    when_state: WAITING
    duration_seconds: 2

  - type: check_ocr_state
    name: vpn_confirmed_before_tiktok
    when_state: WAITING
    on_failure: pause
    action:
      texts: ["Not Connected", "NOT CONNECTED", "Not connected"]
      threshold: 0.65
      duration_seconds: 12
      retry_delay: 1.5
      state_if_found: WAITING
      state_if_missing: ACTIVE
      fallback_template: vpntoggle
      state_if_fallback: WAITING
      require_state: ACTIVE

  # ── 10. TikTok (home screen) ────────────────────────────────────────
  - type: execute_action
    name: go_home_for_tiktok
    action:
      type: home
    skip_post_action: true

  - type: wait
    name: settle_for_tiktok
    duration_seconds: 1

  - type: wait_for_detection
    name: wait_for_tiktok_icon
    templates: [tiktok]
    when_detection: tiktok
    duration_seconds: 60
    min_seconds: 2
    on_failure: pause

  - type: screenshot
    name: fresh_tiktok_screen
    templates: [tiktok]

  - type: analyze_screen
    name: fresh_tiktok_analyze
    templates: [tiktok]

  - type: verify
    name: confirm_tiktok_before_tap
    condition: template_match
    template: tiktok
    on_failure: pause

  - type: execute_action
    name: open_tiktok
    requires_analysis: true
    on_failure: pause
    action:
      type: tap_detection
      detection: tiktok
    skip_post_action: true

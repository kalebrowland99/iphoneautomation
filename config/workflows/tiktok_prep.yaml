name: tiktok_prep
description: >
  Sequential prep (Labely account 1): unlock → force-quit apps → clear/upload gallery
  with VPN off (phones start off — no Shadowrocket step). Then turn VPN on via
  Shadowrocket (376, 1013) + toggle (511, 172), open TikTok.

loop: false

steps:
  # ── 1. Unlock if locked ─────────────────────────────────────────────
  - type: screenshot
    name: initial_screen
    templates: [lock_screen]

  - type: analyze_screen
    name: analyze_initial
    templates: [lock_screen]

  - type: execute_action
    name: unlock_device
    when_detection: lock_screen
    on_failure: pause
    action:
      type: tap_detection
      detection: lock_screen
    skip_post_action: true

  - type: execute_action
    name: swipe_unlock
    when_detection: lock_screen
    on_failure: pause
    action:
      type: swipe
      x1: 200
      y1: 500
      x2: 200
      y2: 200
      duration_ms: 300
    skip_post_action: true

  - type: wait
    name: after_unlock
    when_detection: lock_screen
    duration_seconds: 2

  # ── 2. Force-quit apps (same as tiktok_end) ─────────────────────────
  - type: execute_action
    name: go_home_before_kill
    action:
      type: home
    skip_post_action: true

  - type: wait
    name: settle_before_kill
    duration_seconds: 3

  - type: execute_action
    name: kill_apps
    on_failure: pause
    action:
      type: kill_app
    skip_post_action: true

  - type: wait
    name: after_kill
    duration_seconds: 3

  - type: execute_action
    name: go_home
    action:
      type: home
    skip_post_action: true

  - type: wait
    name: settle_home
    duration_seconds: 3

  # ── 3. Clear photo library (iMouse album API — Photos app not required) ─
  # go_home above — no second home press before clear.
  - type: execute_action
    name: clear_album
    on_failure: pause
    action:
      type: album_clear
      skip_vpn_off: true
      timeout_ms: 60000
      sheet_appear_timeout_seconds: 18
      round_active_timeout_seconds: 60
      sheet_poll_interval_seconds: 5
    skip_post_action: true

  # album_clear loops until Recents is empty (3 or 20+ items), then upload runs.
  - type: wait
    name: after_clear
    duration_seconds: 3

  # ── 4. Upload gallery folder (slot number, e.g. gallery/12/) ──────
  - type: execute_action
    name: upload_gallery
    on_failure: pause
    action:
      type: album_upload
      skip_vpn_off: true
      folder: ${gallery_folder}
    skip_post_action: true

  - type: wait
    name: upload_progress
    duration_seconds: 10

  - type: execute_action
    name: tap_allow_upload
    action:
      type: tap_ocr
      texts: ["Always Allow", "Allow Full Access", "Allow Access to All Photos", "Allow Paste", "Allow"]
      optional: true
      wait_timeout_seconds: 10
      poll_interval_seconds: 1.5
    skip_post_action: true

  - type: wait
    name: upload_settle
    duration_seconds: 5

  # ── 5. Go home before VPN check ─────────────────────────────────────
  - type: execute_action
    name: go_home_before_vpn
    action:
      type: home
    skip_post_action: true

  - type: wait
    name: settle_home_vpn
    duration_seconds: 0.5

  # ── 6. Open Shadowrocket → tap (511, 172) to turn VPN on ─────────────
  - type: execute_action
    name: open_shadowrocket
    on_failure: pause
    action:
      type: tap
      x: 376
      y: 1013
    skip_post_action: true

  - type: wait
    name: shadowrocket_open
    duration_seconds: 2

  - type: execute_action
    name: tap_vpn_toggle_coord
    on_failure: pause
    action:
      type: tap
      x: 511
      y: 172
    skip_post_action: true

  - type: wait
    name: after_vpn_toggle_coord
    duration_seconds: 5

  # ── 8. Home after VPN ───────────────────────────────────────────────
  - type: execute_action
    name: go_home_after_vpn
    action:
      type: home
    skip_post_action: true

  - type: wait
    name: after_vpn_home
    duration_seconds: 2

  # ── 9. TikTok (home screen) ────────────────────────────────────────
  - type: execute_action
    name: go_home_for_tiktok
    action:
      type: home
    skip_post_action: true

  - type: wait
    name: settle_for_tiktok
    duration_seconds: 3

  - type: wait_for_detection
    name: wait_for_tiktok_icon
    templates: [tiktok]
    when_detection: tiktok
    duration_seconds: 60
    min_seconds: 2
    on_failure: pause

  - type: screenshot
    name: fresh_tiktok_screen
    templates: [tiktok]

  - type: analyze_screen
    name: fresh_tiktok_analyze
    templates: [tiktok]

  - type: verify
    name: confirm_tiktok_before_tap
    condition: template_match
    template: tiktok
    on_failure: pause

  - type: execute_action
    name: open_tiktok
    requires_analysis: true
    on_failure: pause
    action:
      type: tap_detection
      detection: tiktok
    skip_post_action: true

name: warmup
description: Screenshot-driven warmup cycle with state verification
enabled: true
loop: true
max_iterations: 0
device_groups:
  - default
  - production

variables:
  swipe_direction: "up"

steps:
  - type: screenshot
    name: capture_initial

  - type: analyze
    name: analyze_initial
    templates:
      - home_screen
      - lock_screen

  - type: determine_state
    name: set_initial_state
    state_rules:
      - condition: template_match
        template: lock_screen
        state: WAITING
      - condition: template_match
        template: home_screen
        state: IDLE
      - condition: default
        state: UNKNOWN_SCREEN

  - type: check_popups
    name: handle_popups

  - type: execute_action
    name: swipe_up
    requires_analysis: true
    when_state: IDLE
    action:
      type: swipe
      direction: "${swipe_direction}"
      length: 0.5

  - type: wait_random
    name: human_delay
    min_seconds: 2
    max_seconds: 5

  - type: screenshot
    name: capture_after_swipe

  - type: analyze
    name: analyze_after_swipe

  - type: determine_state
    name: verify_state
    state_rules:
      - condition: default
        state: ACTIVE

  - type: check_popups
    name: final_popup_check

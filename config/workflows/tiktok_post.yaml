name: tiktok_post
description: >
  TikTok post editor flow: plus → gallery → media pick → music → text overlay →
  editor scrub, then final posting. Loops 3 times (3 posts). Per-post onscreen text
  (${post_caption}) and final caption (${final_post_caption}); gallery item at
  (${gallery_x}, ${gallery_y}).

loop: true
max_iterations: 3

steps:
  # ── 1. Wait for + (TikTok loaded), then tap ─────────────────────────
  - type: wait_for_detection
    name: wait_for_plus
    templates: [plus]
    when_detection: plus
    duration_seconds: 90
    min_seconds: 2
    on_failure: pause

  - type: screenshot
    name: fresh_plus_screen
    templates: [plus]

  - type: analyze_screen
    name: fresh_plus_analyze
    templates: [plus]

  - type: verify
    name: confirm_plus_before_tap
    condition: template_match
    template: plus
    on_failure: pause

  - type: execute_action
    name: tap_plus
    requires_analysis: true
    on_failure: pause
    action:
      type: tap_detection
      detection: plus
      refind_on_device: true
    skip_post_action: true

  - type: wait
    name: after_plus
    duration_seconds: 1

  # ── 2. Tap gallery (fixed coord) ────────────────────────────────────
  - type: execute_action
    name: tap_gallery
    on_failure: pause
    action:
      type: tap
      x: 33
      y: 669
      tap_count: 2
      tap_interval_seconds: 0.5
    skip_post_action: true

  - type: execute_action
    name: wait_for_recents
    on_failure: pause
    action:
      type: tap_ocr
      texts: ["Recents", "RECENTS", "Recent", "RECENT"]
      wait_timeout_seconds: 45
      poll_interval_seconds: 1.5
      verify_only: true
      optional: false
      prefer_top: true
      threshold: 0.55
      contain: true
      ocr_ex: true
      search_rect_pct: [0.0, 0.0, 1.0, 0.32]
      # Gallery icon may be offset on some phones (e.g. slot 9) — retap then retry Recents.
      fallback_tap:
        x: 326
        y: 609
      fallback_tap_delay_seconds: 1
      fallback_after_tap_seconds: 1.5
      fallback_retry_seconds: 45
    skip_post_action: true

  - type: wait
    name: after_gallery_picker
    duration_seconds: 1

  # ── 3. Pick media (Recents: post 1→right 3→left; coords from gallery_x/y)
  - type: execute_action
    name: tap_gallery_item
    on_failure: pause
    action:
      type: tap
      x: ${gallery_x}
      y: ${gallery_y}
    skip_post_action: true

  - type: wait
    name: after_gallery_item
    duration_seconds: 2

  # ── 4. Music gallery button ─────────────────────────────────────────
  - type: execute_action
    name: tap_music_gallery
    on_failure: pause
    action:
      type: tap
      x: 194
      y: 39
    skip_post_action: true

  - type: wait
    name: after_music_gallery
    duration_seconds: 1.5

  # ── 5. Wait for Favorites, then tap ─────────────────────────────────
  - type: execute_action
    name: tap_favorites
    on_failure: pause
    action:
      type: tap_ocr
      texts: ["Favorites", "FAVORITES"]
      wait_timeout_seconds: 60
      poll_interval_seconds: 1.5
      optional: false
    skip_post_action: true

  - type: wait
    name: after_favorites
    duration_seconds: 1.5

  # ── 6. Wait for Hvitserk's choice, then tap ─────────────────────────
  - type: execute_action
    name: tap_hvitserk_choice
    on_failure: pause
    action:
      type: tap_ocr
      texts:
        - "Hvitserk's choice"
        - "Hvitserk's Choice"
        - "Hvitserks choice"
        - "Hvitserks Choice"
        - "HVITSERK'S CHOICE"
      wait_timeout_seconds: 60
      poll_interval_seconds: 1.5
      threshold: 0.65
      optional: false
    skip_post_action: true

  - type: wait
    name: after_hvitserk
    duration_seconds: 1.5

  # ── 7. Dismiss music picker (center tap) ────────────────────────────
  - type: execute_action
    name: dismiss_music_box
    action:
      type: tap
      x: 187
      y: 334
    skip_post_action: true

  - type: wait
    name: after_dismiss_music
    duration_seconds: 1.5

  # ── 8. Wait for AA, then tap ────────────────────────────────────────
  - type: wait_for_detection
    name: wait_for_aa
    templates: [aa]
    when_detection: aa
    duration_seconds: 60
    min_seconds: 2
    on_failure: pause

  - type: execute_action
    name: tap_aa
    requires_analysis: true
    on_failure: pause
    action:
      type: tap_detection
      detection: aa
      refind_on_device: true
    skip_post_action: true

  - type: wait
    name: after_aa
    duration_seconds: 1

  # ── 9. Type onscreen text from dashboard ────────────────────────────
  - type: execute_action
    name: type_onscreen_text
    on_failure: pause
    action:
      type: text_input
      text: ${post_caption}
    skip_post_action: true

  - type: wait
    name: after_caption
    duration_seconds: 1.5

  # ── 10. White background — fixed coord (201, 38) ×2 ───────────────
  - type: execute_action
    name: tap_white_background
    on_failure: pause
    action:
      type: tap
      x: 201
      y: 38
      tap_count: 2
      tap_interval_seconds: 0.5
    skip_post_action: true

  - type: wait
    name: after_white_background
    duration_seconds: 1.5

  # ── 11. Done (top-right) ────────────────────────────────────────────
  - type: execute_action
    name: tap_done
    on_failure: pause
    action:
      type: tap_ocr
      texts: ["Done", "DONE"]
      prefer_top: true
      optional: false
      wait_timeout_seconds: 60
      poll_interval_seconds: 1.5
    skip_post_action: true

  - type: wait
    name: after_done
    duration_seconds: 3

  # ── 12. Editor icon — fixed coord (374, 163) ────────────────────────
  - type: execute_action
    name: tap_editor
    on_failure: pause
    action:
      type: tap
      x: 374
      y: 163
    skip_post_action: true

  - type: wait
    name: after_editor
    duration_seconds: 1.5

  # ── 13. Swipe left twice (timeline scrub area) ──────────────────────
  - type: execute_action
    name: swipe_left_1
    action:
      type: swipe
      direction: left
      sx: 341
      sy: 533
      ex: 40
      ey: 533
    skip_post_action: true

  - type: wait
    name: after_swipe_1
    duration_seconds: 1.5

  - type: execute_action
    name: swipe_left_2
    action:
      type: swipe
      direction: left
      sx: 341
      sy: 533
      ex: 40
      ey: 533
    skip_post_action: true

  - type: wait
    name: after_swipe_2
    duration_seconds: 1.5

  # ── 14. Text scrub marker ───────────────────────────────────────────
  - type: execute_action
    name: tap_text_scrub
    on_failure: pause
    action:
      type: tap
      x: 161
      y: 561
    skip_post_action: true

  - type: wait
    name: after_text_scrub
    duration_seconds: 1.5

  # ── 15. Hold + drag clip trim ───────────────────────────────────────
  - type: execute_action
    name: drag_trim
    on_failure: pause
    action:
      type: drag
      x1: 214
      y1: 508
      direction: left
      distance: 172
      duration_ms: 1000
      move_ms: 10
      hold_ms: 0
    skip_post_action: true

  - type: wait
    name: after_drag_trim
    duration_seconds: 2

  # ── 16. Wait for continue arrow (or Post), then tap ─────────────────
  - type: wait_for_detection
    name: wait_for_continuearrow
    templates: [continuearrow, post]
    when_detection: continuearrow
    duration_seconds: 60
    min_seconds: 2
    on_failure: pause
    action:
      ocr_fallback_texts: ["Post", "POST"]
      ocr_fallback_as: post_ocr
      ocr_threshold: 0.75
      ocr_prefer_bottom: true

  - type: execute_action
    name: tap_continuearrow
    when_detection: continuearrow
    requires_analysis: true
    on_failure: pause
    action:
      type: tap_detection
      detection: continuearrow
      refind_on_device: true
    skip_post_action: true

  - type: execute_action
    name: tap_post_ocr_fallback
    when_detection: post_ocr
    requires_analysis: true
    on_failure: pause
    action:
      type: tap_detection
      detection: post_ocr
    skip_post_action: true

  - type: wait
    name: after_continuearrow
    duration_seconds: 2

  # ── 17. Tap caption field (skip if Post OCR already tapped) ────────
  - type: execute_action
    name: tap_final_caption_field
    unless_detection: post_ocr
    on_failure: pause
    action:
      type: tap
      x: 107
      y: 130
    skip_post_action: true

  - type: wait
    name: after_tap_caption_field
    duration_seconds: 2

  # ── 18. Type final post caption + hashtags (single line, no Enter) ─
  - type: execute_action
    name: type_final_post_caption
    unless_detection: post_ocr
    on_failure: pause
    action:
      type: text_input
      text: ${final_post_caption}
      single_line: true
    skip_post_action: true

  - type: wait
    name: after_final_caption
    duration_seconds: 3

  # ── 19. Post button — fixed coord (352, 45), production only ────────
  - type: execute_action
    name: tap_post
    unless_debug_skip_post: true
    on_failure: pause
    action:
      type: tap
      x: 352
      y: 45
    skip_post_action: true

  - type: wait
    name: after_post
    unless_debug_skip_post: true
    duration_seconds: 2

  # Post 3 only: wait for TikTok upload to finish before leaving the app.
  - type: wait
    name: wait_for_upload_after_final_post
    when_post_index: 3
    unless_debug_skip_post: true
    duration_seconds: 300

  # Leave TikTok UI (keyboard / upload overlay) before tiktok_end — post 3 only.
  - type: execute_action
    name: leave_tiktok_after_post
    when_post_index: 3
    unless_debug_skip_post: true
    action:
      type: home
    skip_post_action: true

  - type: wait
    name: after_leave_tiktok
    when_post_index: 3
    unless_debug_skip_post: true
    duration_seconds: 1.5

  # ── 19b. Debug: kill TikTok & reopen (skip real post) ───────────────
  - type: execute_action
    name: debug_go_home_before_kill
    when_debug_skip_post: true
    action:
      type: home
    skip_post_action: true

  - type: wait
    name: debug_settle_before_kill
    when_debug_skip_post: true
    duration_seconds: 2

  - type: execute_action
    name: debug_kill_tiktok
    when_debug_skip_post: true
    on_failure: pause
    action:
      type: kill_app
    skip_post_action: true

  - type: wait
    name: debug_after_kill
    when_debug_skip_post: true
    duration_seconds: 2

  - type: execute_action
    name: debug_go_home
    when_debug_skip_post: true
    action:
      type: home
    skip_post_action: true

  - type: wait
    name: debug_settle_home
    when_debug_skip_post: true
    duration_seconds: 2

  - type: wait_for_detection
    name: debug_wait_for_tiktok
    when_debug_skip_post: true
    templates: [tiktok]
    when_detection: tiktok
    duration_seconds: 30
    min_seconds: 2
    on_failure: pause

  - type: execute_action
    name: debug_open_tiktok
    when_debug_skip_post: true
    requires_analysis: true
    on_failure: pause
    action:
      type: tap_detection
      detection: tiktok
      refind_on_device: true
    skip_post_action: true

  - type: wait
    name: debug_after_reopen
    when_debug_skip_post: true
    duration_seconds: 3

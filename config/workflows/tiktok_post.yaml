name: tiktok_post
description: >
  TikTok post editor flow: plus → gallery → media pick → music → text overlay →
  editor scrub, then final posting. Loops 3 times (3 posts). Per-post onscreen text
  (${post_caption}) and final caption (${final_post_caption}); gallery item at
  (${gallery_x}, ${gallery_y}).

loop: true
max_iterations: 3

steps:
  # ── 1. Wait for + (TikTok loaded), then tap ─────────────────────────
  - type: wait_for_detection
    name: wait_for_plus
    templates: [plus]
    when_detection: plus
    duration_seconds: 90
    min_seconds: 2
    on_failure: pause

  - type: screenshot
    name: fresh_plus_screen
    templates: [plus]

  - type: analyze_screen
    name: fresh_plus_analyze
    templates: [plus]

  - type: verify
    name: confirm_plus_before_tap
    condition: template_match
    template: plus
    on_failure: pause

  - type: execute_action
    name: tap_plus
    requires_analysis: true
    on_failure: pause
    action:
      type: tap_detection
      detection: plus
      refind_on_device: true
    skip_post_action: true

  - type: wait
    name: after_plus
    duration_seconds: 1

  # ── 2. Wait for gallery, then tap ───────────────────────────────────
  - type: wait_for_detection
    name: wait_for_gallery
    templates: [gallery]
    when_detection: gallery
    duration_seconds: 60
    min_seconds: 2
    on_failure: pause

  - type: screenshot
    name: fresh_gallery_screen
    templates: [gallery]

  - type: analyze_screen
    name: fresh_gallery_analyze
    templates: [gallery]

  - type: verify
    name: confirm_gallery_before_tap
    condition: template_match
    template: gallery
    on_failure: pause

  - type: execute_action
    name: tap_gallery
    requires_analysis: true
    on_failure: pause
    action:
      type: tap_detection
      detection: gallery
      refind_on_device: true
      tap_count: 2
      tap_interval_seconds: 0.5
    skip_post_action: true

  - type: execute_action
    name: wait_for_select_multiple
    on_failure: pause
    action:
      type: tap_ocr
      texts: ["Select Multiple", "SELECT MULTIPLE", "Select multiple"]
      wait_timeout_seconds: 30
      poll_interval_seconds: 2
      verify_only: true
      optional: false
    skip_post_action: true

  - type: wait
    name: after_gallery_picker
    duration_seconds: 1

  # ── 3. Pick media (coordinate varies per post: 1→82,201 2→191,190 3→321,194)
  - type: execute_action
    name: tap_gallery_item
    on_failure: pause
    action:
      type: tap
      x: ${gallery_x}
      y: ${gallery_y}
    skip_post_action: true

  - type: wait
    name: after_gallery_item
    duration_seconds: 2

  # ── 4. Music gallery button ─────────────────────────────────────────
  - type: execute_action
    name: tap_music_gallery
    on_failure: pause
    action:
      type: tap
      x: 194
      y: 39
    skip_post_action: true

  - type: wait
    name: after_music_gallery
    duration_seconds: 1.5

  # ── 5. Wait for Favorites, then tap ─────────────────────────────────
  - type: execute_action
    name: tap_favorites
    on_failure: pause
    action:
      type: tap_ocr
      texts: ["Favorites", "FAVORITES"]
      wait_timeout_seconds: 60
      poll_interval_seconds: 1.5
      optional: false
    skip_post_action: true

  - type: wait
    name: after_favorites
    duration_seconds: 1.5

  # ── 6. Wait for Hvitserk's choice, then tap ─────────────────────────
  - type: execute_action
    name: tap_hvitserk_choice
    on_failure: pause
    action:
      type: tap_ocr
      texts:
        - "Hvitserk's choice"
        - "Hvitserk's Choice"
        - "Hvitserks choice"
        - "Hvitserks Choice"
        - "HVITSERK'S CHOICE"
      wait_timeout_seconds: 60
      poll_interval_seconds: 1.5
      threshold: 0.65
      optional: false
    skip_post_action: true

  - type: wait
    name: after_hvitserk
    duration_seconds: 1.5

  # ── 7. Dismiss music picker (center tap) ────────────────────────────
  - type: execute_action
    name: dismiss_music_box
    action:
      type: tap
      x: 187
      y: 334
    skip_post_action: true

  - type: wait
    name: after_dismiss_music
    duration_seconds: 1.5

  # ── 8. Wait for AA, then tap ────────────────────────────────────────
  - type: wait_for_detection
    name: wait_for_aa
    templates: [aa]
    when_detection: aa
    duration_seconds: 60
    min_seconds: 2
    on_failure: pause

  - type: execute_action
    name: tap_aa
    requires_analysis: true
    on_failure: pause
    action:
      type: tap_detection
      detection: aa
      refind_on_device: true
    skip_post_action: true

  - type: wait
    name: after_aa
    duration_seconds: 1

  # ── 9. Type onscreen text from dashboard ────────────────────────────
  - type: execute_action
    name: type_onscreen_text
    on_failure: pause
    action:
      type: text_input
      text: ${post_caption}
    skip_post_action: true

  - type: wait
    name: after_caption
    duration_seconds: 1.5

  # ── 10. White background — tap border / border2 once each if visible ─
  - type: screenshot
    name: screen_borders
    templates: [border, border2]

  - type: analyze_screen
    name: analyze_borders
    templates: [border, border2]

  - type: execute_action
    name: tap_border_if_visible
    on_failure: continue
    action:
      type: tap_detection
      detection: border
      optional: true
    skip_post_action: true

  - type: execute_action
    name: tap_border2_if_visible
    on_failure: continue
    action:
      type: tap_detection
      detection: border2
      optional: true
    skip_post_action: true

  - type: wait
    name: after_border
    duration_seconds: 1.5

  # ── 11. Done (top-right) ────────────────────────────────────────────
  - type: execute_action
    name: tap_done
    on_failure: pause
    action:
      type: tap_ocr
      texts: ["Done", "DONE"]
      prefer_top: true
      optional: false
      wait_timeout_seconds: 60
      poll_interval_seconds: 1.5
    skip_post_action: true

  - type: wait
    name: after_done
    duration_seconds: 2

  # ── 12. Wait for editor, then tap ───────────────────────────────────
  - type: wait_for_detection
    name: wait_for_editor
    templates: [editor]
    when_detection: editor
    duration_seconds: 60
    min_seconds: 2
    on_failure: pause

  - type: screenshot
    name: fresh_editor_screen
    templates: [editor]

  - type: analyze_screen
    name: fresh_editor_analyze
    templates: [editor]

  - type: verify
    name: confirm_editor_before_tap
    condition: template_match
    template: editor
    on_failure: pause

  - type: execute_action
    name: tap_editor
    requires_analysis: true
    on_failure: pause
    action:
      type: tap_detection
      detection: editor
      refind_on_device: true
    skip_post_action: true

  - type: wait
    name: after_editor
    duration_seconds: 1

  # ── 13. Swipe left (timeline scrub area) ────────────────────────────
  - type: execute_action
    name: swipe_left_1
    action:
      type: swipe
      direction: left
      sx: 341
      sy: 533
      ex: 40
      ey: 533
    skip_post_action: true

  - type: wait
    name: after_swipe_1
    duration_seconds: 1.5

  # ── 14. Text scrub marker ───────────────────────────────────────────
  - type: execute_action
    name: tap_text_scrub
    on_failure: pause
    action:
      type: tap
      x: 161
      y: 561
    skip_post_action: true

  - type: wait
    name: after_text_scrub
    duration_seconds: 1.5

  # ── 15. Hold + drag clip trim ───────────────────────────────────────
  - type: execute_action
    name: drag_trim
    on_failure: pause
    action:
      type: drag
      x1: 214
      y1: 508
      direction: left
      distance: 172
      duration_ms: 1000
      move_ms: 10
      hold_ms: 0
    skip_post_action: true

  - type: wait
    name: after_drag_trim
    duration_seconds: 2

  # ── 16. Wait for continue arrow (or Post), then tap ─────────────────
  - type: wait_for_detection
    name: wait_for_continuearrow
    templates: [continuearrow, post]
    when_detection: continuearrow
    duration_seconds: 60
    min_seconds: 2
    on_failure: pause
    action:
      ocr_fallback_texts: ["Post", "POST"]
      ocr_fallback_as: post_ocr
      ocr_threshold: 0.75
      ocr_prefer_bottom: true

  - type: execute_action
    name: tap_continuearrow
    when_detection: continuearrow
    requires_analysis: true
    on_failure: pause
    action:
      type: tap_detection
      detection: continuearrow
      refind_on_device: true
    skip_post_action: true

  - type: execute_action
    name: tap_post_ocr_fallback
    when_detection: post_ocr
    requires_analysis: true
    on_failure: pause
    action:
      type: tap_detection
      detection: post_ocr
    skip_post_action: true

  - type: wait
    name: after_continuearrow
    duration_seconds: 2

  # ── 17. Tap caption field (skip if Post OCR already tapped) ────────
  - type: execute_action
    name: tap_final_caption_field
    unless_detection: post_ocr
    on_failure: pause
    action:
      type: tap
      x: 107
      y: 130
    skip_post_action: true

  - type: wait
    name: after_tap_caption_field
    duration_seconds: 2

  # ── 18. Type final post caption + hashtags ────────────────────────
  - type: execute_action
    name: type_final_post_caption
    unless_detection: post_ocr
    on_failure: pause
    action:
      type: text_input
      text: ${final_post_caption}
    skip_post_action: true

  - type: wait
    name: after_final_caption
    duration_seconds: 2

  # ── 19. Wait for post button, then tap — production only ────────────
  - type: wait_for_detection
    name: wait_for_post
    unless_debug_skip_post: true
    templates: [post]
    when_detection: post
    duration_seconds: 60
    min_seconds: 2
    on_failure: pause

  - type: execute_action
    name: tap_post
    unless_debug_skip_post: true
    requires_analysis: true
    on_failure: pause
    action:
      type: tap_detection
      detection: post
      refind_on_device: true
    skip_post_action: true

  - type: wait
    name: after_post
    unless_debug_skip_post: true
    duration_seconds: 2

  # Leave TikTok UI (keyboard / upload overlay) before tiktok_end force-quit.
  - type: execute_action
    name: leave_tiktok_after_post
    unless_debug_skip_post: true
    action:
      type: home
    skip_post_action: true

  - type: wait
    name: after_leave_tiktok
    unless_debug_skip_post: true
    duration_seconds: 1.5

  # ── 19b. Debug: kill TikTok & reopen (skip real post) ───────────────
  - type: execute_action
    name: debug_go_home_before_kill
    when_debug_skip_post: true
    action:
      type: home
    skip_post_action: true

  - type: wait
    name: debug_settle_before_kill
    when_debug_skip_post: true
    duration_seconds: 2

  - type: execute_action
    name: debug_kill_tiktok
    when_debug_skip_post: true
    on_failure: pause
    action:
      type: kill_app
    skip_post_action: true

  - type: wait
    name: debug_after_kill
    when_debug_skip_post: true
    duration_seconds: 2

  - type: execute_action
    name: debug_go_home
    when_debug_skip_post: true
    action:
      type: home
    skip_post_action: true

  - type: wait
    name: debug_settle_home
    when_debug_skip_post: true
    duration_seconds: 2

  - type: wait_for_detection
    name: debug_wait_for_tiktok
    when_debug_skip_post: true
    templates: [tiktok]
    when_detection: tiktok
    duration_seconds: 30
    min_seconds: 2
    on_failure: pause

  - type: execute_action
    name: debug_open_tiktok
    when_debug_skip_post: true
    requires_analysis: true
    on_failure: pause
    action:
      type: tap_detection
      detection: tiktok
      refind_on_device: true
    skip_post_action: true

  - type: wait
    name: debug_after_reopen
    when_debug_skip_post: true
    duration_seconds: 3

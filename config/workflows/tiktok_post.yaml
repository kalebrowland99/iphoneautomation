name: tiktok_post
description: >
  TikTok post editor flow: plus → gallery → media pick → music → text overlay →
  editor scrub, then final posting. Loops 3 times (3 posts). Per-post onscreen text
  (${post_caption}) and final caption (${final_post_caption}); gallery item at
  (${gallery_x}, ${gallery_y}).

loop: true
max_iterations: 3

steps:
  # ── 1. Wait for + (TikTok loaded), then tap ─────────────────────────
  - type: wait_for_detection
    name: wait_for_plus
    templates: [plus]
    when_detection: plus
    duration_seconds: 90
    min_seconds: 2
    on_failure: pause

  - type: screenshot
    name: fresh_plus_screen
    templates: [plus]

  - type: analyze_screen
    name: fresh_plus_analyze
    templates: [plus]

  - type: verify
    name: confirm_plus_before_tap
    condition: template_match
    template: plus
    on_failure: pause

  - type: execute_action
    name: tap_plus
    requires_analysis: true
    on_failure: pause
    action:
      type: tap_detection
      detection: plus
      refind_on_device: true
      tap_count: 2
      tap_interval_seconds: 0.5
    skip_post_action: true

  - type: wait
    name: after_plus
    duration_seconds: 5

  # ── 2. Double-tap gallery (58, 1035) ────────────────────────────────
  - type: execute_action
    name: tap_gallery
    on_failure: pause
    action:
      type: tap
      x: 58
      y: 1035
      tap_count: 2
      tap_interval_seconds: 0.5
    skip_post_action: true

  - type: execute_action
    name: wait_for_recents
    on_failure: pause
    action:
      type: tap_ocr
      texts: ["Recents", "RECENTS", "Recent", "RECENT"]
      wait_timeout_seconds: 10
      poll_interval_seconds: 1.5
      verify_only: true
      optional: false
      prefer_top: true
      threshold: 0.55
      contain: true
      ocr_ex: true
      search_rect_pct: [0.0, 0.0, 1.0, 0.32]
      # Gallery icon may be offset on some phones (e.g. slot 9) — retap then retry Recents.
      fallback_tap:
        x: 527
        y: 940
        tap_count: 2
        tap_interval_seconds: 0.5
      fallback_tap_delay_seconds: 1
      fallback_after_tap_seconds: 1.5
      fallback_retry_seconds: 10
    skip_post_action: true

  - type: wait
    name: after_gallery_picker
    duration_seconds: 3

  # ── 3. Pick media (Recents: post 1→right 3→left; coords from gallery_x/y)
  - type: execute_action
    name: tap_gallery_item
    on_failure: pause
    action:
      type: tap
      x: ${gallery_x}
      y: ${gallery_y}
    skip_post_action: true

  - type: wait
    name: after_gallery_item
    duration_seconds: 3

  - type: execute_action
    name: tap_next_after_media
    action:
      type: tap_ocr
      texts: ["Next", "NEXT"]
      optional: true
      require_dark_text: true
      max_text_luminance: 110
      wait_timeout_seconds: 30
      poll_interval_seconds: 1
      threshold: 0.65
      contain: true
      skip_if_texts_present: ["Your Story", "YOUR STORY", "Your story", "Story"]
      skip_if_all_texts_present: ["Your", "Story"]
      skip_if_story_button: true
      skip_if_threshold: 0.45
      skip_if_ocr_ex: true
    skip_post_action: true

  # ── 4. Music gallery button ─────────────────────────────────────────
  - type: execute_action
    name: tap_music_gallery
    on_failure: pause
    action:
      type: tap
      x: 310
      y: 62
    skip_post_action: true

  - type: wait
    name: after_music_gallery
    duration_seconds: 3

  # ── 5. Wait for Favorites, then tap ─────────────────────────────────
  - type: execute_action
    name: tap_favorites
    on_failure: pause
    action:
      type: tap_ocr
      texts: ["Favorites", "FAVORITES"]
      wait_timeout_seconds: 60
      poll_interval_seconds: 1.5
      optional: false
      tap_count: 2
      tap_interval_seconds: 0.5
    skip_post_action: true

  # ── 6. Wait for Hvitserk or unstable retry while music loads ────────
  - type: execute_action
    name: tap_hvitserk_choice
    on_failure: pause
    action:
      type: tap_ocr
      texts:
        - "Hvitserk's choice"
        - "Hvitserk's Choice"
        - "Hvitserks choice"
        - "Hvitserks Choice"
        - "HVITSERK'S CHOICE"
        - "Hvitserk"
      wait_timeout_seconds: 120
      after_retry_wait_seconds: 60
      max_wait_timeout_seconds: 300
      unstable_retry_texts:
        - "Your network is unstable. Tap to retry."
        - "Your network is unstable"
        - "network is unstable"
        - "Tap to retry"
      unstable_retry_cooldown_seconds: 2
      poll_interval_seconds: 1.5
      threshold: 0.6
      optional: false
    skip_post_action: true

  - type: wait
    name: after_hvitserk
    duration_seconds: 3

  # ── 7. Dismiss music picker (center tap) ────────────────────────────
  - type: execute_action
    name: dismiss_music_box
    action:
      type: tap
      x: 187
      y: 334
    skip_post_action: true

  - type: wait
    name: after_dismiss_music
    duration_seconds: 3

  # ── 8. Tap Aa (fixed coord) ─────────────────────────────────────────
  - type: wait
    name: before_tap_aa
    duration_seconds: 3

  - type: execute_action
    name: tap_aa
    on_failure: pause
    action:
      type: tap
      x: 566
      y: 422
      tap_count: 1
    skip_post_action: true

  - type: wait
    name: after_aa
    duration_seconds: 3

  # ── 9. Type onscreen text from dashboard ────────────────────────────
  - type: execute_action
    name: type_onscreen_text
    on_failure: pause
    action:
      type: text_input
      text: ${post_caption}
    skip_post_action: true

  - type: wait
    name: after_caption
    duration_seconds: 3

  # ── 10. White background — fixed coord (303, 63) ×2, post 1 only ───
  - type: execute_action
    name: tap_white_background
    when_post_index: 1
    on_failure: pause
    action:
      type: tap
      x: 303
      y: 63
      tap_count: 2
      tap_interval_seconds: 0.5
    skip_post_action: true

  - type: wait
    name: after_white_background
    when_post_index: 1
    duration_seconds: 3

  # ── 11. Done (top-right) ────────────────────────────────────────────
  - type: execute_action
    name: tap_done
    on_failure: pause
    action:
      type: tap_ocr
      texts: ["Done", "DONE"]
      prefer_top: true
      optional: false
      wait_timeout_seconds: 60
      poll_interval_seconds: 1.5
    skip_post_action: true

  - type: wait
    name: after_done
    duration_seconds: 3

  # ── 12. Editor icon — fixed coord (566, 247) ────────────────────────
  - type: execute_action
    name: tap_editor
    on_failure: pause
    action:
      type: tap
      x: 566
      y: 247
    skip_post_action: true

  - type: wait
    name: after_editor
    duration_seconds: 3

  # ── 13. Swipe left twice (timeline scrub area) ──────────────────────
  - type: execute_action
    name: swipe_left
    action:
      type: swipe
      direction: left
      sx: 526
      sy: 922
      ex: 40
      ey: 922
      swipe_count: 2
      swipe_interval_seconds: 1.5
    skip_post_action: true

  - type: wait
    name: after_swipe_left
    duration_seconds: 3

  # ── 14. Text scrub marker ───────────────────────────────────────────
  - type: execute_action
    name: tap_text_scrub
    on_failure: pause
    action:
      type: tap
      x: 240
      y: 846
    skip_post_action: true

  - type: wait
    name: after_text_scrub
    duration_seconds: 3

  # ── 15. Hold + drag clip trim ───────────────────────────────────────
  - type: execute_action
    name: drag_trim
    on_failure: pause
    action:
      type: drag
      x1: 320
      y1: 771
      x2: 55
      y2: 765
      duration_ms: 850
      move_ms: 10
      hold_ms: 0
    skip_post_action: true

  - type: wait
    name: after_drag_trim
    duration_seconds: 3

  # ── 16. Wait for continue arrow (or Post), then tap ─────────────────
  - type: wait_for_detection
    name: wait_for_continuearrow
    templates: [continuearrow, post]
    when_detection: continuearrow
    duration_seconds: 60
    min_seconds: 2
    on_failure: pause
    action:
      ocr_fallback_texts: ["Post", "POST"]
      ocr_fallback_as: post_ocr
      ocr_threshold: 0.75
      ocr_prefer_bottom: true

  - type: execute_action
    name: tap_continuearrow
    when_detection: continuearrow
    requires_analysis: true
    on_failure: pause
    action:
      type: tap_detection
      detection: continuearrow
      refind_on_device: true
    skip_post_action: true

  - type: execute_action
    name: tap_post_ocr_fallback
    when_detection: post_ocr
    requires_analysis: true
    on_failure: pause
    action:
      type: tap_detection
      detection: post_ocr
    skip_post_action: true

  - type: wait
    name: after_continuearrow
    duration_seconds: 3

  # ── 17. Tap caption field (skip if Post OCR already tapped) ────────
  - type: execute_action
    name: tap_final_caption_field
    unless_detection: post_ocr
    on_failure: pause
    action:
      type: tap
      x: 107
      y: 130
    skip_post_action: true

  - type: wait
    name: after_tap_caption_field
    duration_seconds: 3

  # ── 18. Type final post caption + hashtags (single line, no Enter) ─
  - type: execute_action
    name: type_final_post_caption
    unless_detection: post_ocr
    on_failure: pause
    action:
      type: text_input
      text: ${final_post_caption}
      single_line: true
    skip_post_action: true

  - type: wait
    name: after_final_caption
    duration_seconds: 3

  # ── 19. Post button — fixed coord (544, 68), production only ────────
  - type: execute_action
    name: tap_post
    unless_debug_skip_post: true
    on_failure: pause
    action:
      type: tap
      x: 544
      y: 68
    skip_post_action: true

  - type: wait
    name: after_post
    unless_debug_skip_post: true
    duration_seconds: 3

  # Post 3 only: wait for TikTok upload to finish before leaving the app.
  - type: wait
    name: wait_for_upload_after_final_post
    when_post_index: 3
    unless_debug_skip_post: true
    duration_seconds: 120

  # Leave TikTok UI (keyboard / upload overlay) before tiktok_end — post 3 only.
  - type: execute_action
    name: leave_tiktok_after_post
    when_post_index: 3
    unless_debug_skip_post: true
    action:
      type: home
    skip_post_action: true

  - type: wait
    name: after_leave_tiktok
    when_post_index: 3
    unless_debug_skip_post: true
    duration_seconds: 3

  # ── 19b. Debug: kill TikTok & reopen (skip real post) ───────────────
  - type: execute_action
    name: debug_go_home_before_kill
    when_debug_skip_post: true
    action:
      type: home
    skip_post_action: true

  - type: wait
    name: debug_settle_before_kill
    when_debug_skip_post: true
    duration_seconds: 2

  - type: execute_action
    name: debug_kill_tiktok
    when_debug_skip_post: true
    on_failure: pause
    action:
      type: kill_app
    skip_post_action: true

  - type: wait
    name: debug_after_kill
    when_debug_skip_post: true
    duration_seconds: 2

  - type: execute_action
    name: debug_go_home
    when_debug_skip_post: true
    action:
      type: home
    skip_post_action: true

  - type: wait
    name: debug_settle_home
    when_debug_skip_post: true
    duration_seconds: 2

  - type: wait_for_detection
    name: debug_wait_for_tiktok
    when_debug_skip_post: true
    templates: [tiktok]
    when_detection: tiktok
    duration_seconds: 30
    min_seconds: 2
    on_failure: pause

  - type: execute_action
    name: debug_open_tiktok
    when_debug_skip_post: true
    requires_analysis: true
    on_failure: pause
    action:
      type: tap_detection
      detection: tiktok
      refind_on_device: true
    skip_post_action: true

  - type: wait
    name: debug_after_reopen
    when_debug_skip_post: true
    duration_seconds: 3

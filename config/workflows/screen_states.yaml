# Screen state definitions for template matching and workflow branching.

screen_states:
  lock_screen:
    description: "Device lock screen"
    templates:
      - name: lock_screen
        path: lock_screen.jpg
        threshold: 0.75

  vpn_active:
    description: "VPN connected (Shadowrocket — no Not Connected label)"
    ocr_keywords:
      - "Not Connected"

  vpn_off:
    description: "VPN disconnected (Shadowrocket shows Not Connected)"
    ocr_keywords:
      - "Not Connected"

  shadowrocket_home:
    description: "Shadowrocket app on home screen"
    templates:
      - name: shadowrocket
        path: shadowrocket.jpg
        threshold: 0.42

  shadowrocket_toggle:
    description: "Shadowrocket VPN toggle switch (on / prep)"
    templates:
      - name: vpntoggle
        path: vpntoggle.jpg
        threshold: 0.42

  shadowrocket_toggle_off:
    description: "Shadowrocket blue toggle (VPN on — tap to turn off)"
    templates:
      - name: bluetoggle
        path: bluetoggle.jpg
        threshold: 0.42

ui_elements:
  - name: shadowrocket
    template: shadowrocket.jpg
    threshold: 0.42
  - name: vpntoggle
    template: vpntoggle.jpg
    threshold: 0.42
  - name: bluetoggle
    template: bluetoggle.jpg
    threshold: 0.42
  - name: tiktok
    template: tiktok.jpg
    threshold: 0.42
  - name: plus
    template: plus.jpg
    threshold: 0.50
    device_threshold: 0.50
    min_confidence: 0.48
    search_rect_pct: [0.30, 0.82, 0.70, 1.0]
  - name: gallery
    template: gallery2.jpg
    threshold: 0.20
    search_rect_pct: [0.0, 0.72, 0.50, 1.0]
    tap_offset: [-29, 0]
  - name: aa
    template: aa.jpg
    threshold: 0.40
    search_rect_pct: [0.9, 0.0, 1.0, 1.0]
    match_white_text: true
  - name: border
    template: border.jpg
    threshold: 0.30
  - name: border2
    template: border2.jpg
    threshold: 0.28
  - name: editor
    template: editor.jpg
    threshold: 0.40
    device_threshold: 0.60
    min_confidence: 0.62
    search_rect_pct: [0.50, 0.68, 1.0, 0.90]
    match_white_text: true
  - name: continuearrow
    template: continuearrow.jpg
    threshold: 0.32
  - name: post
    template: post.jpg
    threshold: 0.38
  - name: photos
    template: photos.jpg
    threshold: 0.42
  - name: lock_screen
    template: lock_screen.jpg
    threshold: 0.75

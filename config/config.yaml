# iMouse Farm - Main Configuration

imouse:
  host: "localhost"
  port: 9911
  mode: "websocket"
  reconnect_interval_seconds: 5
  device_poll_interval_seconds: 10
  auto_airplay_reconnect: false
  airplay_reconnect_on_startup: false
  airplay_connect_delay_seconds: 4
  airplay_reconnect_interval_seconds: 30
  # Re-broadcast mDNS when no phones are casting (skipped while mirrored)
  mdns_refresh_enabled: true
  mdns_refresh_interval_seconds: 30

database:
  path: "data/imouse_farm.db"

screenshots:
  directory: "data/screenshots"
  retention_hours: 24
  periodic_interval_seconds: 0  # 0 = off; workflows capture on demand
  max_per_device: 100

openai:
  enabled: true
  api_key: ""  # set OPENAI_API_KEY in .env (see .env.example)
  model: "gpt-4o-mini"
  temperature: 0.85
  # Account-switcher opener (dropdown arrow tap) — gpt-5.5 vision
  account_switcher_vision_model: "gpt-5.5"
  # TikTok editor Aa (text) button on right toolbar — same model as account switcher
  aa_vision_model: "gpt-5.5"

gallery:
  base_directory: "gallery"
  media_extensions:
    - ".mp4"
    - ".mov"
    - ".m4v"
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".heic"
  upload_timeout_ms: 300000

analysis:
  template_match_threshold: 0.8
  small_template_threshold: 0.42
  use_device_template_match: true
  ocr_language: "eng"
  tesseract_cmd: null
  templates_directory: "config/templates"

vision:
  provider: "opencv_tesseract"  # opencv_tesseract | local_model
  model_path: ""

timing:
  action_retry_count: 0
  action_retry_delay_seconds: 2
  action_timeout_seconds: 30
  frozen_device_threshold_seconds: 120
  workflow_step_delay_seconds: 0.25
  unknown_screen_escalation_count: 5
  permission_watcher_poll_seconds: 0.25  # background popup scan (runs until kill/disconnect)
  contacts_watcher_poll_seconds: 0.2  # dedicated fast loop: tap Don't allow on find-contacts sheet

device_groups:
  default:
    description: "Default device group"
    workflow: "tiktok_prep"
  production:
    description: "Production automation devices"
    workflow: "tiktok_prep"

notifications:
  enabled: true
  discord:
    enabled: false
    webhook_url: ""
  telegram:
    enabled: false
    bot_token: ""
    chat_id: ""
  events:
    device_disconnect: true
    unknown_screen: true
    repeated_failures: true
    workflow_completion: true
  repeated_failure_threshold: 3

dashboard:
  host: "0.0.0.0"
  port: 8080
  farm_slots: 20
  split_windows_on_run: true
  chrome_side: left
  imouse_window_title: "iMouse"
  cors_origins:
    - "*"

# Local slideshow-ui → gallery ingest → farm batch (set FARM_SECRET in .env)
slideshow:
  enabled: true
  app_base_url: "http://localhost:3000"
  app_port: 3000
  farm_secret: ""
  slideshows_per_slot: 3  # MP4s per phone (20 phones × 3 = 60 Labely videos per full run)
  slides_per_slideshow: 1  # slide segments validated inside each MP4
  use_embedded_runner: true  # iframe in farm dashboard (no Playwright popup)
  use_playwright_runner: false
  automation_timeout_seconds: 10800  # 60 videos × ~3 min each
  clear_slot_before_ingest: true
  auto_generate_captions: true
  default_onscreen_template: "america_sick"
  blank_video_max_retries: 2
  debug_slideshows_per_slot: 1  # debug Slideshow tab → 1 MP4 per test run

# Shadowrocket VPN — home → tap icon → vision STATUS → maybe tap fixed toggle → confirm.
vpn:
  icon_x: 373
  icon_y: 1003
  toggle_x: 515
  toggle_y: 171
  app_settle_seconds: 4
  after_toggle_settle_seconds: 4
  confirm_settle_seconds: 2
  vision_model: "gpt-4o"

# Per-phone TikTok UI overrides (farm slot number = iMouse user_name).
tiktok_device_ui:
  slots:
    "16":
      ui_label: "Different UI"
      use_alternate_account_switcher: true
      account_switcher_opener:
        x: 101
        y: 147

batch:
  batch_size: 2
  # One cast attempt per phone (no auto-retry loop). Flip Cast toggle / re-run to retry.
  cast_connect_max_attempts: 1
  cast_connect_retry_seconds: 15
  # Cast via Control Bar UI (no /device/airplay/connect). Success = iMouse state online.
  cast_ui:
    enabled: true
    wake_screen: true
    wake_settle_seconds: 3.5
    post_home_settle_seconds: 1.25
    control_bar_fn_key: ControlBar
    after_control_bar_seconds: 1.5
    screen_mirroring_x: 159
    screen_mirroring_y: 384
    after_mirroring_seconds: 10
    target_x: 178
    target_y: 316
    after_target_seconds: 2
    confirm_timeout_seconds: 20
    confirm_poll_seconds: 1
    home_after_connect_count: 3
    home_after_connect_interval_seconds: 1
  batch_device_timeout_seconds: 7200
  disconnect_on_complete: true
  between_phones_pause_seconds: 0
  chain_valcoin_after_labely: true
  skip_prep_when_valid: true
  # Phones that often hit album/SDK 调用超时 — reboot then cast before prep/post.
  flawed_timeout_slots: [2, 7, 9, 16, 18, 20]
  # Personal phones — never automated (like slot 11). No prep/post/warmup/videos.
  excluded_slots: [12]
  session_recording:
    enabled: true
    fps: 2  # screenshots per second into gallery/<slot>/<YYYY-MM-DD>/session_HHMMSS.mp4
  kernel_recovery:
    enabled: true
    failure_threshold: 2  # after N iMouseXP failures, restart kernel and resume at first failed phone
    max_recovery_attempts: 2
    kernel_restart_wait_seconds: 20
  warmup:
    duration_seconds: 1200
    swipe_delay_min_seconds: 0
    swipe_delay_max_seconds: 53
    swipe_delay_mean_seconds: 4
    swipe_delay_long_watch_probability: 0.20
    double_tap_interval_seconds: 0.35

logging:
  level: "INFO"
  format: "json"  # json or console
  file: "data/logs/imouse_farm.log"

diagnostics:
  phone_restart_boot_wait_seconds: 90

workflows_directory: "config/workflows"
